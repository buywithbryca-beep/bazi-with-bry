<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BaZi with Bry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF0EE; --panel:#F8FAF9; --panel2:#E3E8E5; --ink:#16201E; --muted:#56635F; --line:#C9D2CE;
  --seal:#A92E26; --seal-ink:#FFFFFF; --focus:#1F5F8B; --gold:#A92E26;
  --wood:#2F7D45; --fire:#C23B2A; --earth:#9A6B1F; --metal:#6B7682; --water:#24578F;
  --wood-bg:#E1EFE4; --fire-bg:#F6E1DD; --earth-bg:#F2E8D6; --metal-bg:#E6E9EC; --water-bg:#DEE7F2;
  --clash:#B3261E; --harm:#9A5B00; --combo:#2F6B4F;
  --shadow:0 1px 2px rgba(22,32,30,.06),0 4px 16px rgba(22,32,30,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101614; --panel:#18201E; --panel2:#212B28; --ink:#E4EBE8; --muted:#9AA7A2; --line:#33403C;
    --seal:#D4574B; --seal-ink:#FFFFFF; --focus:#7FB8E0; --gold:#D4574B;
    --wood:#6FC086; --fire:#F07A66; --earth:#D9A652; --metal:#AEB8C2; --water:#79A8DE;
    --wood-bg:#1C3024; --fire-bg:#3A1E1A; --earth-bg:#352A17; --metal-bg:#262C31; --water-bg:#1A2839;
    --clash:#F08A80; --harm:#E0A850; --combo:#7CC7A0;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101614; --panel:#18201E; --panel2:#212B28; --ink:#E4EBE8; --muted:#9AA7A2; --line:#33403C;
  --seal:#D4574B; --seal-ink:#FFFFFF; --focus:#7FB8E0; --gold:#D4574B;
  --wood:#6FC086; --fire:#F07A66; --earth:#D9A652; --metal:#AEB8C2; --water:#79A8DE;
  --wood-bg:#1C3024; --fire-bg:#3A1E1A; --earth-bg:#352A17; --metal-bg:#262C31; --water-bg:#1A2839;
  --clash:#F08A80; --harm:#E0A850; --combo:#7CC7A0;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1240px;margin:0 auto}
.zh{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.seal{width:52px;height:52px;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;border-radius:6px;font-size:19px;font-weight:900;line-height:1;letter-spacing:0}
.top h1{font-size:24px;font-weight:600;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.top .spacer{flex:1}

.layout{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.form{padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:900px){.form{position:static}}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lab{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:38px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:8px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--seal)}
.check small{display:block;color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--seal);border-color:var(--seal);color:var(--seal-ink);font-weight:600}
.btn.small{padding:6px 10px;font-size:13px}
.hint{font-size:12px;color:var(--muted);margin:0}
.combo{position:relative}
#city-list{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:300px;overflow-y:auto}
#city-list li{display:flex;justify-content:space-between;gap:10px;padding:7px 9px;border-radius:5px;cursor:pointer;font-size:13.5px}
#city-list li[aria-selected=true],#city-list li[data-i]:hover{background:var(--panel2)}
#city-list .cl-meta{color:var(--muted);font-size:11.5px;flex-shrink:0}
#city-list .cl-msg{color:var(--muted);cursor:default}
.custom[hidden]{display:none!important}
.divider{height:1px;background:var(--line);margin:2px 0}

/* results */
.results{display:flex;flex-direction:column;gap:20px;min-width:0}
.sect{padding:18px 20px}
.sect-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sect-h h2{font-size:16px;font-weight:600}
.sect-h .zh{color:var(--muted);font-size:14px}
.sect-h .aside{margin-left:auto;font-size:12.5px;color:var(--muted)}

.summary{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media (max-width:560px){.summary{grid-template-columns:1fr}}
.dm-glyph{width:92px;height:92px;border-radius:10px;display:grid;place-items:center;font-size:56px;font-weight:900;border:1px solid var(--line)}
.sum-name{font-size:20px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--bg)}
.chip b{font-weight:600}
.example{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--panel2);color:var(--muted);padding:2px 8px;border-radius:4px;vertical-align:middle;margin-left:8px}
.timeline-note{margin-top:10px;font-size:12.5px;color:var(--muted)}

/* pillars */
.pillars-wrap{overflow-x:auto}
.pillars{display:grid;grid-template-columns:110px repeat(4,minmax(112px,1fr));min-width:560px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pillars>div{padding:8px 10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center}
.pillars>div.rh{text-align:left;border-left:0;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;background:var(--panel2)}
.pillars>div.last{border-bottom:0}
.pillars .colh{font-weight:600;background:var(--panel2);font-size:13px}
.pillars .colh.dmcol{background:var(--seal);color:var(--seal-ink)}
.glyph{font-size:40px;font-weight:700;line-height:1.1}
.gsub{font-size:12px;color:var(--muted)}
.god{font-size:13px;font-weight:600}
.god .zh{font-weight:500;color:var(--muted);margin-left:4px;font-size:12px}
.hidlist{display:flex;flex-direction:column;gap:3px;align-items:center}
.hid{font-size:12.5px;display:flex;gap:6px;align-items:baseline;justify-content:center}
.hid .zh{font-size:16px;font-weight:700}
.missing{color:var(--muted);font-size:12.5px;padding-top:30px!important}
.el-Wood{color:var(--wood)} .el-Fire{color:var(--fire)} .el-Earth{color:var(--earth)} .el-Metal{color:var(--metal)} .el-Water{color:var(--water)}
.bg-Wood{background:var(--wood-bg)} .bg-Fire{background:var(--fire-bg)} .bg-Earth{background:var(--earth-bg)} .bg-Metal{background:var(--metal-bg)} .bg-Water{background:var(--water-bg)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.two{grid-template-columns:1fr}}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:118px 1fr 64px;gap:10px;align-items:center;font-size:13.5px}
.track{height:14px;background:var(--panel2);border-radius:3px;overflow:hidden}
.fill{height:100%;border-radius:3px}
.bar .v{text-align:right;color:var(--muted);font-size:12.5px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.tag.dm{background:var(--seal);color:var(--seal-ink)}
.tag.res{background:var(--panel2);color:var(--ink)}

.meter{position:relative;height:18px;border-radius:4px;background:linear-gradient(90deg,var(--panel2) 0 35%,var(--panel2) 35% 45%,var(--panel2) 45% 55%,var(--panel2) 55%);overflow:visible;margin:22px 0 26px;border:1px solid var(--line)}
.meter .zone{position:absolute;top:0;bottom:0;border-right:1px dashed var(--line)}
.meter .needle{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--seal);border-radius:2px;transform:translateX(-1px)}
.meter .ticks{position:absolute;top:22px;left:0;right:0;font-size:11px;color:var(--muted)}
.meter .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}

/* interactions */
.ints{display:flex;flex-direction:column;gap:6px}
.int{display:grid;grid-template-columns:200px 1fr;gap:10px;align-items:baseline;padding:8px 10px;border-radius:6px;background:var(--bg);border-left:3px solid var(--line);font-size:13.5px}
@media (max-width:520px){.int{grid-template-columns:1fr;gap:2px}}
.int.clash{border-left-color:var(--clash)} .int.harm{border-left-color:var(--harm)} .int.combo{border-left-color:var(--combo)}
.int .t{font-weight:600}
.int.clash .t{color:var(--clash)} .int.harm .t{color:var(--harm)} .int.combo .t{color:var(--combo)}
.int .n{color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}

/* luck */
.luck-scroll{overflow-x:auto;padding-bottom:6px}
.luck{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(104px,1fr);gap:8px;min-width:min-content}
.lp{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px 8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center}
.lp:hover{border-color:var(--muted)}
.lp[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.lp .age{font-size:12px;font-weight:600}
.lp .yr{font-size:11.5px;color:var(--muted)}
.lp .glyph{font-size:28px}
.lp .gg{font-size:11.5px;color:var(--muted);line-height:1.3}
.now{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--seal);color:var(--seal-ink);padding:1px 6px;border-radius:3px}
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:14px}
.yp{border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:8px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.yp[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.yp .y{font-size:12.5px;font-weight:600}
.yp .glyph{font-size:22px}
.yp .gg{font-size:11px;color:var(--muted);line-height:1.3}
.sub-h{font-size:13px;font-weight:600;margin:18px 0 8px}

.bg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:560px){.bg-grid{grid-template-columns:1fr}}
.mini{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center;background:var(--bg)}
.mini .glyph{font-size:30px}
.mini .lab{display:block;margin-bottom:2px}
.mini .d{font-size:12.5px;line-height:1.4}

.yearbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.yearbar select{width:auto;min-width:140px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
.tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel2);padding:7px 10px}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl td.big{font-size:22px;font-weight:700;line-height:1.2}
.tbl tr.cur td{background:var(--bg)}
.tbl tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--seal)}
.ic{font-size:12.5px;line-height:1.45}
.ic.clash b{color:var(--clash)} .ic.harm b{color:var(--harm)} .ic.combo b{color:var(--combo)}
.ic b{font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{font-size:12.5px;color:var(--combo)}
.notes{font-size:13px;color:var(--muted)}
.notes p{margin:0 0 8px;max-width:78ch}
.notes b{color:var(--ink);font-weight:600}
textarea#copyfallback{width:100%;min-height:160px;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px;font:12px/1.5 "IBM Plex Mono",monospace;color:var(--ink)}
.brand{display:flex;align-items:center;gap:18px;margin-bottom:20px;flex-wrap:wrap}
.brand-lion{width:76px;height:76px;border-radius:50%;border:2px solid var(--seal);flex-shrink:0;background:var(--panel);color:var(--seal);display:flex;align-items:center;justify-content:center}
.brand-lion svg{width:56px;height:auto;display:block;margin-top:-2px}
.lk-f{fill:currentColor}.lk-b{fill:var(--panel)}.lk-cr{fill:currentColor;stroke:var(--panel);stroke-width:3;paint-order:stroke;stroke-linejoin:round}.lk-c{fill:none;stroke:var(--panel);stroke-width:1.7;stroke-linecap:round}.lk-l{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand-logo{width:118px;height:auto;border-radius:10px;border:1px solid var(--line);display:block;flex-shrink:0}
.emb-crown path{stroke:var(--panel)}
.brand-title{font-size:clamp(26px,4vw,32px);font-weight:600;letter-spacing:-.01em;margin:0}
.brand-title span{color:var(--seal)}
.brand-tag{margin:2px 0 0;font-size:15px;color:var(--ink)}
.brand-sub{margin:4px 0 0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mini-sel{width:auto;min-height:30px;padding:4px 8px;font-size:13px}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:start}
@media (max-width:860px){.qgrid{grid-template-columns:1fr}}
.tgs{display:flex;flex-direction:column;gap:6px;font-size:13px}
.tgs-head,.tgs-row{display:grid;grid-template-columns:minmax(178px,1.4fr) 1fr 1fr;gap:8px;align-items:center}
.tgs-head span{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:center}
.tgs-name b{font-size:16px;margin-right:2px}
.tgs-zh{color:var(--muted);font-size:12px}
.tgs-bar{position:relative;height:20px;background:var(--panel2);border-radius:4px;overflow:hidden}
.tgs-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.tgs-nat{background:var(--gold);opacity:.32}
.tgs-yr{background:var(--gold);opacity:.72}
.tgs-v{position:absolute;left:7px;top:0;line-height:20px;font-size:11.5px;font-weight:600;color:var(--ink)}
.qr p{margin:0 0 9px;font-size:14px;max-width:72ch}
.qr ul{margin:0 0 10px;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.qr-h{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:16px 0 8px}
.qr-chip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.qr-chip.qr-good{color:var(--combo);border-color:var(--combo)}
.qr-chip.qr-hard{color:var(--clash);border-color:var(--clash)}
.qr-chip.qr-watch{color:var(--harm);border-color:var(--harm)}
.qr-chip.qr-neutral{color:var(--muted)}
.qr li.qr-clash::marker{color:var(--clash)}
.qr li.qr-harm::marker{color:var(--harm)}
.qr li.qr-combo::marker{color:var(--combo)}
.qr-muted{color:var(--muted);font-size:12.5px}
.qr-lesson{padding:9px 12px;background:var(--bg);border-radius:6px}
.qr-conf{margin-top:8px!important}
.rq-box{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.rq-card{display:flex;gap:20px;align-items:center;background:#0E0E10;color:#EDE6D6;border-radius:12px;padding:16px 20px;border:1px solid #3A3226;flex-wrap:wrap}
.rq-crest{width:150px;max-width:40%;height:auto;border-radius:8px;flex-shrink:0}
.rq-copy{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.rq-kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#C9A458}
.rq-title{font-size:19px;font-weight:600;color:#F3ECDC}
.rq-text{font-size:13.5px;color:#BDB4A3;max-width:52ch}
.rq-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.rq-lion{background:linear-gradient(180deg,#D9B86A,#B8913F);color:#141210;border:1px solid #E6C77E;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.rq-lion:hover{filter:brightness(1.07)}
.rq-wa{background:transparent;color:#EDE6D6;border:1px solid #6D604A;border-radius:8px;padding:10px 16px;text-decoration:none;font-weight:500}
.rq-form{display:flex;flex-direction:column;gap:12px;max-width:620px}
.rq-form textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit;color:inherit}
.rq-hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.rq-status{font-size:13px;color:var(--muted)}
.rq-done{margin:0;padding:10px 12px;background:var(--bg);border-radius:6px}
.rq-wa{text-decoration:none}
.ai-box{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.ai-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.ai-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ai-ctl input{width:160px}
.ai-status{font-size:13px;color:var(--muted);margin-top:8px}
.ai-out{margin-top:10px;max-width:78ch}
.ai-out h3{font-size:16px;margin:16px 0 6px}
.ai-out p{margin:0 0 9px}
.ai-out ul{margin:0 0 10px;padding-left:18px}
.vn-wrap{display:grid;grid-template-columns:128px 1fr;gap:20px;align-items:start}
@media (max-width:640px){.vn-wrap{grid-template-columns:1fr}.vn-emblem{flex-direction:row;justify-content:flex-start}}
.vn-emblem{border-radius:12px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:1px solid var(--line)}
.vn-svg{width:96px;height:96px;display:block;fill:currentColor}
.vn-cap{font-size:12.5px;line-height:1.35;color:var(--ink)}
.vn-cap b{font-size:16px;font-weight:600}
.rp-page .vn-wrap{display:flex;gap:18px}.rp-page .vn-body{flex:1}
.rp-page .vn-emblem{width:100px;flex-shrink:0;border:1px solid #DCE2DF;padding:8px 6px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.rp-page .vn-emblem.bg-Wood{background:#E1EFE4}.rp-page .vn-emblem.bg-Fire{background:#F6E1DD}.rp-page .vn-emblem.bg-Earth{background:#F2E8D6}.rp-page .vn-emblem.bg-Metal{background:#E6E9EC}.rp-page .vn-emblem.bg-Water{background:#DEE7F2}

.vn-two ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}

.vn-pro{color:var(--combo)} .vn-con{color:var(--clash)}
.vn-twist{margin-top:14px;padding:10px 12px;background:var(--bg);border-radius:6px;font-size:13.5px}
.rp-page .vn-two{display:flex;gap:24px}.rp-page .vn-two>div{flex:1}
.rp-page .vn-two ul{padding-left:16px;gap:1px;font-size:11px;line-height:1.35}
.rp-page .vn-h{font-size:10.5px;margin:0 0 5px}
.rp-page .vn-pro{color:#2F6B4F}.rp-page .vn-con{color:#B3261E}
.rp-page .vn-twist{background:#F3F5F4;font-size:11px;margin-top:6px;padding:5px 9px}
.rp-cover-lion{width:70px;height:70px;border-radius:50%;border:2px solid #A92E26;flex-shrink:0;background:#fff;color:#A92E26;display:flex;align-items:center;justify-content:center}
.rp-cover-lion svg{width:50px;height:auto;display:block;margin-top:-2px}
.rp-page .lk-f{fill:#A92E26}.rp-page .lk-b{fill:#fff}.rp-page .lk-cr{fill:#A92E26;stroke:#fff;stroke-width:3;paint-order:stroke;stroke-linejoin:round}.rp-page .lk-c{fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round}.rp-page .lk-l{fill:none;stroke:#A92E26;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.rp-page .emb-crown path{stroke:#fff}
.rp-brand{font-size:24px;font-weight:600;color:#16201E;letter-spacing:-.01em;line-height:1.1}
.rp-brand span{color:#A92E26}
.rp-tagline{font-size:12px;color:#3A4643;margin-top:2px}
.rp-caps{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#6B7682;margin-top:3px}
.rp-cover-name{font-size:20px;font-weight:600;margin:0}
.rp-cover-right{margin-left:auto;text-align:right}
.rp-page .tgs{display:flex;flex-direction:column;gap:4px;font-size:11px}

.rp-page .tgs-head span{font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#56635F;text-align:center}
.rp-page .tgs-name b{font-size:14px}
.rp-page .tgs-zh{color:#6B7682;font-size:10px}
.rp-page .tgs-bar{position:relative;height:15px;background:#E9ECEB;border-radius:3px;overflow:hidden}
.rp-page .tgs-fill{position:absolute;left:0;top:0;bottom:0}
.rp-page .tgs-nat{background:#E8CFCB}
.rp-page .tgs-yr{background:#C9706A}

.rp-qr .qr-good{color:#2F6B4F;border-color:#2F6B4F}

.rp-page .rp-head,.rp-page .rp-foot{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#56635F}
.rp-page .rp-head{border-bottom:1.5px solid #A92E26;padding-bottom:6px;margin-bottom:14px}
.rp-page .rp-foot{border-top:1px solid #C9D2CE;padding-top:6px;margin-top:10px}
.rp-content{flex:1;overflow:hidden;min-height:0}
.rp-block{margin-bottom:14px}
.rp-page h1{font-size:26px;margin:2px 0 4px;font-weight:600}
.rp-page h2{font-size:15px;font-weight:600;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid #C9D2CE;color:#16201E}
.rp-page h3{font-size:12.5px;font-weight:600;margin:10px 0 5px}
.rp-cover{display:flex;gap:16px;align-items:center;background:#EDF0EE;border-radius:8px;padding:16px 18px}
.rp-seal{width:58px;height:58px;background:#A92E26;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:6px;font:900 21px "Noto Serif SC","Songti SC",serif}
.rp-kicker{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#A92E26}
.rp-sub{color:#56635F;font-size:12.5px}
.rp-page table{width:100%;border-collapse:collapse}
.rp-kv th{text-align:left;font-weight:600;color:#56635F;width:17%;padding:5px 8px;background:#F3F5F4;border:1px solid #DCE2DF;font-size:11px}
.rp-kv td{padding:5px 8px;border:1px solid #DCE2DF}
.rp-pillars th,.rp-pillars td{border:1px solid #DCE2DF;padding:5px 6px;text-align:center;vertical-align:middle}
.rp-pillars thead th{background:#E3E8E5;font-weight:600}
.rp-pillars thead th.rp-dm{background:#A92E26;color:#fff}

.rp-glyph{font:700 30px/1.15 "Noto Serif SC","Songti SC",serif}
.rp-glyph-s{font:700 18px/1.2 "Noto Serif SC","Songti SC",serif;white-space:nowrap}
.rp-small{font-size:10.5px;color:#56635F}
.rp-muted{color:#6B7682}
.rp-note{font-size:10.5px;color:#56635F;margin-top:6px}
.rp-tbl th{text-align:left;background:#E3E8E5;font-size:10.5px;font-weight:600;padding:5px 7px;border:1px solid #DCE2DF}
.rp-tbl td{padding:5px 7px;border:1px solid #DCE2DF;vertical-align:top}
.rp-tbl tr.rp-cur td{background:#FBEFEC}
.rp-tag{display:inline-block;background:#A92E26;color:#fff;font-size:9px;font-weight:700;padding:0 5px;border-radius:3px;letter-spacing:.06em}
.rp-int{font-size:11px;line-height:1.4;padding:1px 0}
.rp-int b{font-weight:600}
.rp-clash b{color:#B3261E}.rp-harm b{color:#9A5B00}.rp-combo b{color:#2F6B4F}
.rp-two{display:flex;gap:26px}.rp-two>div{flex:1}
.rp-bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:11.5px}
.rp-bar>span:first-child{width:118px;flex-shrink:0}
.rp-track{flex:1;height:11px;background:#E3E8E5;border-radius:2px;overflow:hidden}
.rp-fill{height:100%}
.rp-num{width:38px;text-align:right;color:#56635F}
.rp-cont{font-size:11px;font-weight:600;color:#56635F;margin-bottom:5px}
.rp-method p{margin:0 0 6px;font-size:11px;color:#3A4643}
.rp-el-Wood{color:#2F7D45}.rp-el-Fire{color:#C23B2A}.rp-el-Earth{color:#9A6B1F}.rp-el-Metal{color:#6B7682}.rp-el-Water{color:#24578F}
.rp-bg-Wood{background:#2F7D45}.rp-bg-Fire{background:#C23B2A}.rp-bg-Earth{background:#9A6B1F}.rp-bg-Metal{background:#6B7682}.rp-bg-Water{background:#24578F}

      <h1 class="brand-title">BaZi <span>with Bry</span></h1>

  <form name="reading-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field"><input type="text" name="name"><input type="email" name="email">
    <input type="text" name="phone"><textarea name="message"></textarea><textarea name="chart"></textarea>
  </form>
  <div class="layout">
    <form class="panel form" id="form" autocomplete="off">
      <div class="field">
        <label for="f-name">Name or label</label>
        <input type="text" id="f-name" placeholder="Optional">
      </div>
      <div class="field">
        <span class="lab">Gender (sets Luck Pillar direction)</span>
        <div class="seg" role="group" aria-label="Gender">
          <button type="button" id="g-m" aria-pressed="true">Male</button>
          <button type="button" id="g-f" aria-pressed="false">Female</button>
        </div>
      </div>
      <div class="row">
        <div class="field" style="flex:1.2"><label for="f-y">Birth year</label><select id="f-y"></select></div>
        <div class="field"><label for="f-mo">Month</label><select id="f-mo"></select></div>
        <div class="field" style="flex:.8"><label for="f-dd">Day</label><select id="f-dd"></select></div>
      </div>
      <div class="row">
        <div class="field"><label for="f-time">Clock time</label><input type="time" id="f-time"></div>
      </div>
      <label class="check"><input type="checkbox" id="f-unknown"><span>Birth time unknown<small>Shows three pillars and skips the Hour Pillar.</small></span></label>
      <div class="divider"></div>
      <div class="field">
        <label for="f-city">Birth place</label>
        <div class="combo">
          <input type="text" id="f-city" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="city-list" placeholder="City, e.g. Jalandhar or San Juan, Phil" spellcheck="false">
          <ul id="city-list" role="listbox" hidden></ul>
        </div>
        <label class="check" style="margin-top:4px"><input type="checkbox" id="f-manual"><span>Enter longitude and UTC offset manually</span></label>
      </div>
      <div class="custom row" id="custom" hidden>
        <div class="field"><label for="f-lon">Longitude</label><input type="number" id="f-lon" step="0.01" min="-180" max="180" placeholder="-114.07"></div>
        <div class="field"><label for="f-off">UTC offset (hrs)</label><input type="number" id="f-off" step="0.25" min="-12" max="14" placeholder="-7"></div>
      </div>
      <p class="hint" id="tzhint"></p>
      <label class="check"><input type="checkbox" id="f-solar" checked><span>Use true solar time<small>Corrects clock time for longitude and the equation of time. Affects Day and Hour Pillars.</small></span></label>
      <label class="check"><input type="checkbox" id="f-zi" checked><span>New day starts at 23:00<small>Traditional Zi hour rule. Untick to keep the same day until midnight.</small></span></label>
      <button type="submit" class="btn primary">Calculate chart</button>
      <div class="divider"></div>
      <div class="field">
        <label for="f-saved">Saved charts (this browser)</label>
        <div class="row"><select id="f-saved"><option value="">None saved yet</option></select></div>
        <div class="actions"><button type="button" class="btn small" id="b-save">Save current</button><button type="button" class="btn small" id="b-del">Delete selected</button></div>
      </div>
    </form>

    <main class="results" id="results" aria-live="polite"></main>
  </div>

    ['路旁土','Roadside Earth'],['剑锋金','Sword Blade Metal'],['山头火','Mountain Top Fire'],
    ['涧下水','Ravine Water'],['城头土','City Wall Earth'],['白蜡金','White Wax Metal'],
    ['杨柳木','Willow Wood'],['泉中水','Spring Water'],['屋上土','Rooftop Earth'],
    ['霹雳火','Thunderbolt Fire'],['松柏木','Pine and Cypress Wood'],['长流水','Long Flowing Water'],
    ['沙中金','Gold in the Sand'],['山下火','Fire Below the Mountain'],['平地木','Flatland Wood'],
    ['壁上土','Wall Earth'],['金箔金','Gold Leaf Metal'],['覆灯火','Lamp Fire'],
    ['天河水','Heavenly River Water'],['大驿土','Great Post Road Earth'],['钗钏金','Hairpin Metal'],
    ['桑柘木','Mulberry Wood'],['大溪水','Great Stream Water'],['沙中土','Sand Earth'],
    ['天上火','Sky Fire'],['石榴木','Pomegranate Wood'],['大海水','Great Ocean Water']
  ];

  function si(s) { return STEMS.indexOf(s); }
  function bi(b) { return BRANCHES.indexOf(b); }
  function stemEl(s) { return ELEMENTS[Math.floor(si(s) / 2)]; }
  function stemYang(s) { return si(s) % 2 === 0; }
  function branchEl(b) { return BRANCH_EL[bi(b)]; }
  function elIdx(e) { return ELEMENTS.indexOf(e); }
  function sexIdx(s, b) { return (((6 * si(s) - 5 * bi(b)) % 60) + 60) % 60; }
  function ganzhiOf(n) { n = ((n % 60) + 60) % 60; return STEMS[n % 10] + BRANCHES[n % 12]; }
  function yearGanzhi(y) { return ganzhiOf(y - 4); }
  function nayin(gz) { return NAYIN[Math.floor(sexIdx(gz[0], gz[1]) / 2)]; }

  function tenGod(dm, s) {
    var d = elIdx(stemEl(dm)), t = elIdx(stemEl(s));
    var samePol = stemYang(dm) === stemYang(s) ? 0 : 1;
    var rel = (t - d + 5) % 5;
    var key = ['same','out','wealth','power','res'][rel];
    return TEN_GODS[key][samePol];
  }
  function lifeStage(stem, branch) {
    var start = STAGE_START[stem], b = bi(branch);
    var k = stemYang(stem) ? (b - start + 12) % 12 : (start - b + 12) % 12;
    return k;
  }
  function voidBranches(dayGz) {
    var s = si(dayGz[0]), b = bi(dayGz[1]);
    var first = (b - s + 12) % 12;
    return [BRANCHES[(first + 10) % 12], BRANCHES[(first + 11) % 12]];
  }

  /* ---------- Interactions ---------- */
  var STEM_COMBO = [['甲','己','Earth'],['乙','庚','Metal'],['丙','辛','Water'],['丁','壬','Wood'],['戊','癸','Fire']];
  var STEM_CLASH = [['甲','庚'],['乙','辛'],['丙','壬'],['丁','癸']];
  var SIX_COMBO = [['子','丑','Earth'],['寅','亥','Wood'],['卯','戌','Fire'],['辰','酉','Metal'],['巳','申','Water'],['午','未','Fire']];
  var CLASH = [['子','午'],['丑','未'],['寅','申'],['卯','酉'],['辰','戌'],['巳','亥']];
  var HARM = [['子','未'],['丑','午'],['寅','巳'],['卯','辰'],['申','亥'],['酉','戌']];
  var DESTROY = [['子','酉'],['卯','午'],['辰','丑'],['未','戌'],['寅','亥'],['巳','申']];
  var PUNISH_PAIRS = [['寅','巳','Ungrateful'],['巳','申','Ungrateful'],['寅','申','Ungrateful'],
    ['丑','戌','Bullying'],['戌','未','Bullying'],['丑','未','Bullying'],['子','卯','Uncivil']];
  var SELF_PUNISH = ['辰','午','酉','亥'];
  var TRINE = [['申','子','辰','Water'],['亥','卯','未','Wood'],['寅','午','戌','Fire'],['巳','酉','丑','Metal']];
  var MEET = [['寅','卯','辰','Wood'],['巳','午','未','Fire'],['申','酉','戌','Metal'],['亥','子','丑','Water']];

  function matchPair(list, a, b) {
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if ((p[0] === a && p[1] === b) || (p[0] === b && p[1] === a)) return p;
    }
    return null;
  }

  /* items: [{key, label, stem, branch, external:bool}] ; if onlyExternal, keep results that involve an external item */
  function interactions(items, onlyExternal) {
    var out = [];
    function keep(ids) {
      if (!onlyExternal) return true;
      return ids.some(function (i) { return items[i].external; });
    }
    function lbl(ids, part) {
      return ids.map(function (i) { return items[i].label + ' ' + items[i][part]; }).join(' + ');
    }
    var i, j;
    for (i = 0; i < items.length; i++) for (j = i + 1; j < items.length; j++) {
      if (!keep([i, j])) continue;
      var A = items[i], B = items[j], m;
      if (A.stem && B.stem) {
        if ((m = matchPair(STEM_COMBO, A.stem, B.stem))) out.push({type:'Stem Combination', zh:'天干合', tone:'combo', text: lbl([i,j],'stem'), note:'attributed element ' + m[2] + ', transformation not assumed'});
        if (matchPair(STEM_CLASH, A.stem, B.stem)) out.push({type:'Stem Clash', zh:'天干冲', tone:'clash', text: lbl([i,j],'stem'), note:''});
      }
      if (A.branch && B.branch) {
        if ((m = matchPair(SIX_COMBO, A.branch, B.branch))) out.push({type:'Six Harmony', zh:'六合', tone:'combo', text: lbl([i,j],'branch'), note:'attributed element ' + m[2] + (m[0]==='午' ? ' (Earth in some schools)' : '') + ', transformation not assumed'});
        if (matchPair(CLASH, A.branch, B.branch)) out.push({type:'Clash', zh:'冲', tone:'clash', text: lbl([i,j],'branch'), note:''});
        if (matchPair(HARM, A.branch, B.branch)) out.push({type:'Harm', zh:'害', tone:'harm', text: lbl([i,j],'branch'), note:''});
        if (matchPair(DESTROY, A.branch, B.branch)) out.push({type:'Destruction', zh:'破', tone:'harm', text: lbl([i,j],'branch'), note:''});
        if ((m = matchPair(PUNISH_PAIRS, A.branch, B.branch))) out.push({type:'Punishment', zh:'刑', tone:'harm', text: lbl([i,j],'branch'), note: m[2] + ' punishment'});
        if (A.branch === B.branch && SELF_PUNISH.indexOf(A.branch) >= 0) out.push({type:'Self Punishment', zh:'自刑', tone:'harm', text: lbl([i,j],'branch'), note:''});
      }
    }
    function groups(defs, fullName, fullZh, halfName, halfZh, centerOnly) {
      defs.forEach(function (d) {
        var found = [[], [], []];
        items.forEach(function (it, k) { for (var x = 0; x < 3; x++) if (it.branch === d[x]) found[x].push(k); });
        var present = found.filter(function (f) { return f.length; }).length;
        if (present === 3) {
          var ids = [found[0][0], found[1][0], found[2][0]];
          // prefer combos that involve external items when filtering
          if (onlyExternal) {
            for (var x = 0; x < 3; x++) { var ext = found[x].filter(function (k) { return items[k].external; }); if (ext.length) ids[x] = ext[0]; }
          }
          if (keep(ids)) out.push({type: fullName, zh: fullZh, tone:'combo', text: lbl(ids,'branch'), note:'full ' + d[3] + ' frame'});
        } else if (present === 2 && halfName) {
          var have = [0,1,2].filter(function (x) { return found[x].length; });
          if (centerOnly && have.indexOf(1) < 0) return;
          var ids2 = have.map(function (x) { return found[x][0]; });
          if (onlyExternal) {
            ids2 = have.map(function (x) { var ext = found[x].filter(function (k) { return items[k].external; }); return ext.length ? ext[0] : found[x][0]; });
          }
          if (keep(ids2)) out.push({type: halfName, zh: halfZh, tone:'combo', text: lbl(ids2,'branch'), note:'partial ' + d[3] + ' frame'});
        }
      });
    }
    groups(TRINE, 'Three Harmony', '三合', 'Half Three Harmony', '半合', true);
    groups(MEET, 'Directional Meeting', '三会', null, null, false);
    return out;
  }

  /* ---------- Time handling ---------- */
  function tzOffsetMin(tz, y, mo, d, h, mi) {
    // offset (minutes, local minus UTC) of IANA zone tz at the given local wall time
    var fmt = new Intl.DateTimeFormat('en-US', {timeZone: tz, hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'});
    function offAt(ms) {
      var p = {}; fmt.formatToParts(new Date(ms)).forEach(function (x) { p[x.type] = x.value; });
      var asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
      return Math.round((asUtc - ms) / 60000);
    }
    var guess = Date.UTC(y, mo - 1, d, h, mi);
    var o1 = offAt(guess - 0);
    var o2 = offAt(guess - o1 * 60000);
    return o2;
  }
  function equationOfTime(dateUtc) {
    var start = Date.UTC(dateUtc.getUTCFullYear(), 0, 0);
    var N = Math.floor((dateUtc.getTime() - start) / 86400000);
    var B = 2 * Math.PI * (N - 81) / 364;
    return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B); // minutes
  }
  function partsOf(ms) {
    var d = new Date(ms);
    return {y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), s: d.getUTCSeconds()};
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /* ---------- Main calculation ----------
     input: {y,m,d,h,mi, timeKnown, gender:'M'|'F', offsetMin, lon, trueSolar, ziSect:1|2, today:Date} */
  function calculate(inp) {
    var h = inp.timeKnown ? inp.h : 12, mi = inp.timeKnown ? inp.mi : 0;
    var utcMs = Date.UTC(inp.y, inp.m - 1, inp.d, h, mi) - inp.offsetMin * 60000;
    // absolute moment in Beijing time for year / month pillars and Luck Pillar timing
    var bj = partsOf(utcMs + 480 * 60000);
    var absLunar = Solar.fromYmdHms(bj.y, bj.m, bj.d, bj.h, bj.mi, 0).getLunar();
    var absEC = absLunar.getEightChar();
    var pjAbs = absLunar.getPrevJie(false), pjS = pjAbs.getSolar();
    var pjMs = Date.UTC(pjS.getYear(), pjS.getMonth() - 1, pjS.getDay(), pjS.getHour(), pjS.getMinute()) - 480 * 60000;
    // local time used for day / hour pillars
    var lonCorr = 0, eot = 0, localMs;
    if (inp.trueSolar && inp.lon !== null && !isNaN(inp.lon)) {
      lonCorr = inp.lon * 4 - inp.offsetMin; // minutes: mean solar vs clock
      eot = equationOfTime(new Date(utcMs));
      localMs = utcMs + (inp.lon * 4 + eot) * 60000;
    } else {
      localMs = utcMs + inp.offsetMin * 60000;
    }
    var lp = partsOf(localMs);
    var locEC = Solar.fromYmdHms(lp.y, lp.m, lp.d, lp.h, lp.mi, 0).getLunar().getEightChar();
    locEC.setSect(inp.ziSect || 1);

    var gz = {
      year: absEC.getYear(), month: absEC.getMonth(),
      day: locEC.getDay(), hour: inp.timeKnown ? locEC.getTime() : null
    };
    var dm = gz.day[0];

    function pillar(key, label, g) {
      if (!g) return {key: key, label: label, missing: true};
      var s = g[0], b = g[1];
      var hid = HIDDEN[b].map(function (x) { return {stem: x, el: stemEl(x), god: tenGod(dm, x)}; });
      var ny = nayin(g);
      return {
        key: key, label: label, gz: g, stem: s, branch: b,
        stemEl: stemEl(s), stemYang: stemYang(s), branchEl: branchEl(b), branchYang: bi(b) % 2 === 0,
        stemPy: STEM_PY[si(s)], branchPy: BRANCH_PY[bi(b)], animal: ANIMALS[bi(b)],
        stemGod: key === 'day' ? '日主' : tenGod(dm, s), hidden: hid,
        stage: lifeStage(dm, b), selfStage: lifeStage(s, b), nayin: ny
      };
    }
    var pillars = [pillar('hour','Hour',gz.hour), pillar('day','Day',gz.day), pillar('month','Month',gz.month), pillar('year','Year',gz.year)];
    var present = pillars.filter(function (p) { return !p.missing; });

    // element balance
    var elScore = {Wood:0,Fire:0,Earth:0,Metal:0,Water:0};
    var elCount = {Wood:0,Fire:0,Earth:0,Metal:0,Water:0};
    var godScore = {};
    present.forEach(function (p) {
      elScore[p.stemEl] += 1; elCount[p.stemEl] += 1;
      if (p.key !== 'day') godScore[p.stemGod] = (godScore[p.stemGod] || 0) + 1;
      elCount[p.branchEl] += 1;
      var w = HIDDEN_W[p.hidden.length], mult = p.key === 'month' ? 2 : 1;
      p.hidden.forEach(function (hs, k) {
        elScore[hs.el] += w[k] * mult;
        godScore[hs.god] = (godScore[hs.god] || 0) + w[k] * mult;
      });
    });
    var dmEl = stemEl(dm), dmI = elIdx(dmEl);
    var resEl = ELEMENTS[(dmI + 4) % 5];
    var total = 0; ELEMENTS.forEach(function (e) { total += elScore[e]; });
    var support = elScore[dmEl] - 1 + elScore[resEl]; // exclude the Day Master stem itself
    var ratio = support / (total - 1);
    var verdict = ratio >= 0.55 ? 'Strong' : ratio >= 0.45 ? 'Balanced' : ratio >= 0.35 ? 'Weak' : 'Very weak';
    if (ratio >= 0.7) verdict = 'Very strong';

    // season state of Day Master (旺相休囚死)
    var mEl = branchEl(gz.month[1]), rel = (elIdx(mEl) - dmI + 5) % 5;
    var season = [
      {zh:'旺', en:'Prosperous', note:'the season is the Day Master\'s own element'},
      {zh:'休', en:'Resting', note:'the Day Master feeds the season (Output drain)'},
      {zh:'囚', en:'Trapped', note:'the Day Master must control the season (Wealth drain)'},
      {zh:'死', en:'Dead', note:'the season controls the Day Master'},
      {zh:'相', en:'Assisted', note:'the season produces the Day Master'}
    ][rel];
    var roots = [];
    present.forEach(function (p) {
      p.hidden.forEach(function (hs, k) {
        if (hs.el === dmEl) roots.push({pillar: p.label, branch: p.branch, stem: hs.stem, qi: ['main','middle','residual'][k]});
      });
    });

    // Luck pillars
    var yun = absEC.getYun(inp.gender === 'M' ? 1 : 0, 2);
    var ss = yun.getStartSolar();
    var birthMs = utcMs;
    var startMs = Date.UTC(ss.getYear(), ss.getMonth() - 1, ss.getDay());
    var dy = yun.getDaYun(10);
    var luck = [];
    for (var i = 1; i < dy.length; i++) {
      var g2 = dy[i].getGanZhi();
      var sy = ss.getYear() + 10 * (i - 1);
      var sMs = Date.UTC(sy, ss.getMonth() - 1, ss.getDay());
      luck.push({
        gz: g2, stem: g2[0], branch: g2[1], stemGod: tenGod(dm, g2[0]),
        branchGod: tenGod(dm, HIDDEN[g2[1]][0]), stemEl: stemEl(g2[0]), branchEl: branchEl(g2[1]),
        startYear: sy, startMs: sMs, endYear: sy + 10,
        startAge: (sMs - birthMs) / (365.2422 * 86400000), stage: lifeStage(dm, g2[1]),
        hidden: HIDDEN[g2[1]].map(function (x) { return {stem: x, el: stemEl(x), god: tenGod(dm, x)}; })
      });
    }
    var forward = luck.length > 1 && sexIdx(luck[1].stem, luck[1].branch) === (sexIdx(luck[0].stem, luck[0].branch) + 1) % 60;

    var tl = {
      local: lp.y + '-' + pad(lp.m) + '-' + pad(lp.d) + ' ' + pad(lp.h) + ':' + pad(lp.mi),
      bj: bj.y + '-' + pad(bj.m) + '-' + pad(bj.d) + ' ' + pad(bj.h) + ':' + pad(bj.mi),
      utc: (function () { var u = partsOf(utcMs); return u.y + '-' + pad(u.m) + '-' + pad(u.d) + ' ' + pad(u.h) + ':' + pad(u.mi); })(),
      prevJie: pjAbs.getName(), prevJieUtc: (function () { var u = partsOf(pjMs); return u.y + '-' + pad(u.m) + '-' + pad(u.d) + ' ' + pad(u.h) + ':' + pad(u.mi); })(),
      lonCorr: lonCorr, eot: eot, totalShift: inp.trueSolar ? lonCorr + eot : 0
    };

    return {
      input: inp, pillars: pillars, dm: dm, dmEl: dmEl, dmYang: stemYang(dm), dmPy: STEM_PY[si(dm)],
      elScore: elScore, elTotal: total, elCount: elCount, godScore: godScore, support: support, ratio: ratio, verdict: verdict,
      resEl: resEl, season: season, monthEl: mEl, roots: roots, voids: voidBranches(gz.day),
      luck: luck, luckForward: forward, luckStartMs: startMs,
      yun: {y: yun.getStartYear(), m: yun.getStartMonth(), d: yun.getStartDay()},
      birthMs: birthMs, time: tl,
      natalInteractions: interactions(present.map(function (p) { return {label: p.label, stem: p.stem, branch: p.branch}; }), false)
    };
  }

  function annual(year, dm) {
    var g = yearGanzhi(year);
    return {year: year, gz: g, stem: g[0], branch: g[1], stemGod: tenGod(dm, g[0]), branchGod: tenGod(dm, HIDDEN[g[1]][0]),
      stemEl: stemEl(g[0]), branchEl: branchEl(g[1]), animal: ANIMALS[bi(g[1])], stage: lifeStage(dm, g[1]),
      hidden: HIDDEN[g[1]].map(function (x) { return {stem: x, el: stemEl(x), god: tenGod(dm, x)}; })};
  }

  return {
    STEMS: STEMS, BRANCHES: BRANCHES, STEM_PY: STEM_PY, BRANCH_PY: BRANCH_PY, ANIMALS: ANIMALS, ELEMENTS: ELEMENTS, EL_ZH: EL_ZH,
    TG_EN: TG_EN, TG_ABBR: TG_ABBR, TG_GROUP: TG_GROUP, STAGES: STAGES, STAGES_EN: STAGES_EN,
    calculate: calculate, annual: annual, interactions: interactions, tzOffsetMin: tzOffsetMin,
    tenGod: tenGod, lifeStage: lifeStage, stemEl: stemEl, branchEl: branchEl, yearGanzhi: yearGanzhi, nayin: nayin, pad: pad
  };
})();

var $ = function(id){return document.getElementById(id);};

var shardCache = {}, cityHits = [], cityActive = -1;
var regionNames = null; try { regionNames = new Intl.DisplayNames(['en'], {type:'region'}); } catch(e){}
function countryName(cc){ try { return regionNames ? regionNames.of(cc) : cc; } catch(e){ return cc; } }
function normName(t){ return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function cityLabel(r){ return r[0] + (r[2] ? ', ' + r[2] : '') + ', ' + countryName(r[1]); }
function loadShard(k){
  if(shardCache[k]) return shardCache[k];
  if(window.CITY_DATA && window.CITY_DATA[k]){ var rows0 = window.CITY_DATA[k]; rows0.forEach(function(r){ r.key = normName(r[0]); }); shardCache[k] = Promise.resolve(rows0); return shardCache[k]; }
  shardCache[k] = fetch('cities/' + k + '.json').then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(rows){
    rows.forEach(function(r){ r.key = normName(r[0]); }); return rows;
  }).catch(function(){ delete shardCache[k]; return null; });
  return shardCache[k];
}
function showList(open){ $('city-list').hidden = !open; sel.setAttribute('aria-expanded', open ? 'true' : 'false'); }
function renderHits(msg){
  var ul = $('city-list');
  if(msg){ ul.innerHTML = '<li class="cl-msg">' + msg + '</li>'; showList(true); return; }
  ul.innerHTML = cityHits.map(function(r, i){
    var lab = cityLabel(r);
    return '<li role="option" id="co-' + i + '" data-i="' + i + '" aria-selected="' + (i===cityActive) + '"><span>' + esc(lab) + '</span><span class="cl-meta mono">' + (r[3]>=0?r[3].toFixed(2)+'E':(-r[3]).toFixed(2)+'W') + '</span></li>';
  }).join('');
  showList(true);
}
var searchSeq = 0;
function searchCity(){
  var parts = sel.value.split(','), q = normName(parts[0]), qc = normName(parts.slice(1).join(' '));
  function ctry(r){ if(!qc) return true; return normName(countryName(r[1])).indexOf(qc) === 0 || r[1].toLowerCase() === qc || (r[2] || '').toLowerCase() === qc; }
  if(q.length < 2){ showList(false); return; }
  var k = /[a-z]/.test(q[0]) ? q[0] : '0', seq = ++searchSeq;
  renderHits('Searching...');
  loadShard(k).then(function(rows){
    if(seq !== searchSeq) return;
    if(!rows){ renderHits('City list could not load. Tick "Enter longitude and UTC offset manually" instead.'); return; }
    var starts = [], has = [];
    for(var i = 0; i < rows.length && starts.length < 12; i++){ if(rows[i].key.indexOf(q) === 0 && ctry(rows[i])) starts.push(rows[i]); }
    if(starts.length < 12){ for(var j = 0; j < rows.length && starts.length + has.length < 12; j++){ var kk = rows[j].key; if(kk.indexOf(q) > 0 && kk.indexOf(q) < 40 && ctry(rows[j])) has.push(rows[j]); } }
    cityHits = starts.concat(has); cityActive = cityHits.length ? 0 : -1;
    if(!cityHits.length) renderHits('No match. Try a nearby larger city, or enter longitude manually.'); else renderHits();
  });
}
function pickCity(i){
  var r = cityHits[i]; if(!r) return;
  place = {label: cityLabel(r), lon: r[3], tz: TZS[r[5]]};
  sel.value = place.label; showList(false); updateHint();
}
sel.addEventListener('input', function(){ place = null; searchCity(); updateHint(); });
sel.addEventListener('focus', function(){ if(!place && sel.value) searchCity(); });
sel.addEventListener('keydown', function(e){
  if($('city-list').hidden || !cityHits.length) return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); cityActive = Math.min(cityHits.length-1, cityActive+1); renderHits(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); cityActive = Math.max(0, cityActive-1); renderHits(); }
  else if(e.key === 'Enter'){ e.preventDefault(); pickCity(cityActive); }
  else if(e.key === 'Escape'){ showList(false); }
});
$('city-list').addEventListener('mousedown', function(e){ var li = e.target.closest('li[data-i]'); if(li){ e.preventDefault(); pickCity(+li.dataset.i); } });
sel.addEventListener('blur', function(){ setTimeout(function(){ showList(false); }, 120); });
$('f-manual').onchange = function(){ $('custom').hidden = !this.checked; sel.disabled = this.checked; updateHint(); };

var MONTHS_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
(function(){

  MONTHS_FULL.forEach(function(m,i){ var o=document.createElement('option'); o.value=i+1; o.textContent=m; ms.appendChild(o); });

function fillDays(keep){
  var y=+$('f-y').value, m=+$('f-mo').value, n=new Date(Date.UTC(y,m,0)).getUTCDate(), d=$('f-dd'), cur=keep||+d.value||1;
  d.innerHTML=''; for(var i=1;i<=n;i++){ var o=document.createElement('option'); o.value=i; o.textContent=i; d.appendChild(o); }
  d.value=Math.min(cur,n);
}
var fdate = {
  get value(){ return $('f-y').value + '-' + E.pad(+$('f-mo').value) + '-' + E.pad(+$('f-dd').value); },
  set value(v){ var p=String(v).split('-').map(Number); if(p.length<3||!p[0]) return; $('f-y').value=p[0]; $('f-mo').value=p[1]; fillDays(p[2]); }
};
['f-y','f-mo'].forEach(function(id){ $(id).addEventListener('change', function(){ fillDays(); updateHint(); }); });
['f-dd','f-time'].forEach(function(id){ $(id).addEventListener('change', updateHint); });

function readInput(){
  var dv = fdate.value; if(!dv) return {error:'Enter a birth date.'};
  var p = dv.split('-').map(Number), known = !$('f-unknown').checked, h = 12, mi = 0;
  if(known){ var tv = $('f-time').value; if(!tv) return {error:'Enter a birth time, or tick "Birth time unknown".'}; var t = tv.split(':').map(Number); h=t[0]; mi=t[1]; }
  var off, lon, placeLabel;
  if($('f-manual').checked){
    lon = parseFloat($('f-lon').value); off = parseFloat($('f-off').value);
    if(isNaN(off)) return {error:'Enter a UTC offset for the birth place (for example -7 for Calgary in winter).'};
    if(isNaN(lon)) lon = null;
    off = Math.round(off*60); placeLabel = 'Custom (' + (lon===null?'no longitude':lon.toFixed(2)) + ', UTC' + fmtOff(off) + ')';
  } else {
    if(!place) return {error:'Choose the birth place from the city list (type at least two letters), or tick "Enter longitude and UTC offset manually".'};
    var c = place; lon = c.lon; placeLabel = c.label;
    try { off = E.tzOffsetMin(c.tz, p[0], p[1], p[2], h, mi); } catch(e){ return {error:'This browser could not look up the time zone. Choose Custom and enter the UTC offset.'}; }
  }
  return {y:p[0], m:p[1], d:p[2], h:h, mi:mi, timeKnown:known, gender:gender, offsetMin:off, lon:lon,
    trueSolar:$('f-solar').checked, ziSect:$('f-zi').checked?1:2, name:$('f-name').value.trim(), place:placeLabel, placeObj: place};
}
function fmtOff(m){ var s = m<0?'-':'+'; m=Math.abs(m); return s + Math.floor(m/60) + (m%60? ':' + E.pad(m%60) : ''); }
function updateHint(){
  var r = readInput(); if(r.error){ $('tzhint').textContent=''; return; }
  $('tzhint').textContent = 'Clock offset on that date: UTC' + fmtOff(r.offsetMin) + (r.lon!==null ? '  |  Longitude ' + r.lon.toFixed(2) : '');
}

function intsHTML(list, emptyMsg){

  }).join('') + '</div>';
}

var TERMS = {'立春':'Start of Spring','惊蛰':'Awakening of Insects','清明':'Clear and Bright','立夏':'Start of Summer','芒种':'Grain in Ear','小暑':'Minor Heat',
  '立秋':'Start of Autumn','白露':'White Dew','寒露':'Cold Dew','立冬':'Start of Winter','大雪':'Major Snow','小寒':'Minor Cold'};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function ymd(ms){ var d = new Date(ms); return d.getUTCFullYear() + '-' + E.pad(d.getUTCMonth()+1) + '-' + E.pad(d.getUTCDate()); }
function natalItems(c){ return c.pillars.filter(function(p){return !p.missing;}).map(function(p){ return {label:p.label, stem:p.stem, branch:p.branch}; }); }
function luckAt(c, ms){ var r = null; c.luck.forEach(function(l){ if(ms >= l.startMs) r = l; }); return r; }
function timing(c){
  var real = new Date(), natal = natalItems(c), now = real, focused = false;
  if(state.focusYear && state.focusYear !== currentBaziYear()){ now = new Date(state.focusYear, 1, 10); focused = true; }
  var todayStr = now.getFullYear() + '-' + E.pad(now.getMonth()+1) + '-' + E.pad(now.getDate());
  var nowMs = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  var lunNow = Solar.fromYmd(now.getFullYear(), now.getMonth()+1, now.getDate()).getLunar();
  var yNow = lunNow.getYearInGanZhiExact() === E.yearGanzhi(now.getFullYear()) ? now.getFullYear() : now.getFullYear() - 1;
  var year = E.annual(yNow, c.dm), luck = luckAt(c, nowMs);
  // months: checked against natal, the Luck Pillar in force and the year pillar in force
  function monthInts(l, pj, g){
    var ps = pj.getSolar(), mMs = Date.UTC(ps.getYear(), ps.getMonth()-1, ps.getDay()) + 86400000;
    var lk = luckAt(c, mMs), yg = l.getYearInGanZhiExact();
    var items = natal.map(function(it){ return Object.assign({}, it, {external:false}); });
    if(lk) items.push({label:'Luck', stem:lk.stem, branch:lk.branch, external:false});
    var yNum = (yg === E.yearGanzhi(ps.getYear())) ? ps.getYear() : ps.getYear() - 1;
    items.push({label:String(yNum), stem:yg[0], branch:yg[1], external:false});
    items.push({label:MON[ps.getMonth()-1] + ' month', stem:g[0], branch:g[1], external:true});
    return E.interactions(items, true);
  }
  var months = [], cur = Solar.fromYmd(now.getFullYear(), now.getMonth()+1, now.getDate());
  for(var i = 0; i < 12; i++){
    var l = cur.getLunar(), g = l.getMonthInGanZhiExact(), pj = l.getPrevJie(false), nj = l.getNextJie(false);
    var name = pj.getName();
    months.push({gz:g, stem:g[0], branch:g[1], start:pj.getSolar().toYmd(), term:TERMS[name]||name, termZh:name,
      stemEl:E.stemEl(g[0]), branchEl:E.branchEl(g[1]), stemGod:E.tenGod(c.dm, g[0]), branchGod:E.tenGod(c.dm, BZH(g[1])), stage:E.lifeStage(c.dm, g[1]),
      ints:monthInts(l, pj, g)});
    cur = nj.getSolar().next(1);
  }
  var ext = [];
  if(luck) ext.push({label:'Luck', stem:luck.stem, branch:luck.branch, external:true});
  ext.push({label:String(yNow), stem:year.stem, branch:year.branch, external:true});
  ext.push({label:MON[+months[0].start.slice(5,7)-1] + ' month', stem:months[0].stem, branch:months[0].branch, external:true});
  var nowInts = E.interactions(natal.concat(ext), true);
  // next luck
  var next = null;
  c.luck.forEach(function(l){ if(!next && l.startMs > nowMs) next = l; });
  if(next){ next = Object.assign({}, next, {startStr: ymd(next.startMs), ints: E.interactions(natal.concat([{label:'Next luck', stem:next.stem, branch:next.branch, external:true}]), true)}); }
  // years
  var years = [];
  for(var y = yNow; y < yNow + 6; y++){
    var a = E.annual(y, c.dm), lk = luckAt(c, Date.UTC(y, 1, 4)), chg = null;
    c.luck.forEach(function(l){ var d = new Date(l.startMs); if(d.getUTCFullYear() === y && l.startMs > Date.UTC(y,1,4)) chg = {gz:l.gz, startStr:ymd(l.startMs)}; });
    var items = natal.slice(); if(lk) items.push({label:'Luck', stem:lk.stem, branch:lk.branch, external:true});
    items.push({label:String(y), stem:a.stem, branch:a.branch, external:true});
    // only keep results that involve the year itself
    var ints = E.interactions(items.map(function(it){ return Object.assign({}, it, {external: it.label===String(y)}); }), true);
    years.push({a:a, luck:lk, change:chg, ints:ints});
  }
  return {focused:focused, todayStr:todayStr, luck:luck, year:year, months:months, nowInts:nowInts, next:next, years:years};
}
function currentBaziYear(){ var n=new Date(); var l=Solar.fromYmd(n.getFullYear(), n.getMonth()+1, n.getDate()).getLunar(); return l.getYearInGanZhiExact()===E.yearGanzhi(n.getFullYear()) ? n.getFullYear() : n.getFullYear()-1; }
function BZH(b){ return ({'子':'癸','丑':'己','寅':'甲','卯':'乙','辰':'戊','巳':'丙','午':'丁','未':'己','申':'庚','酉':'辛','戌':'戊','亥':'壬'})[b]; }
function intsCompact(list){
  if(!list.length) return '<span class="gsub">None</span>';

    return '<div class="ic ' + x.tone + '"><b>' + x.type + '</b> <span class="zh">' + esc(x.text) + '</span></div>';

}

var EL_HEX = {Wood:'#2F7D45',Fire:'#C23B2A',Earth:'#9A6B1F',Metal:'#6B7682',Water:'#24578F'};
function vnIcon(v, forPrint){
  var body = VN_ICONS[v.animal] || '';
  if(forPrint) body = body.replace(/currentColor/g, EL_HEX[v.el]);
  return '<svg class="vn-svg" viewBox="0 0 512 512" role="img" aria-label="' + v.el + ' ' + v.animal + '"' + (forPrint ? ' width="64" height="64"' : '') + '>' + body + '</svg>';
}
function vietSign(c){
  // Locked convention: the Vietnamese Zodiac year turns at Li Chun (Sun at 315 degrees), the same boundary as the BaZi Year Pillar.
  var yp = c.pillars[3], g = yp.stem, z = yp.branch;
  var animal = VN_ANIMALS[E.BRANCHES.indexOf(z)], el = E.stemEl(g), yang = E.STEMS.indexOf(g) % 2 === 0;
  return {animal: animal, el: el, yang: yang, gz: g + z, traits: VN_TRAITS[animal], twist: VN_ELEMENT[animal][el]};
}
function vietHTML(v, forPrint){
  var cls = '';
  return '<div class="vn-wrap"><div class="vn-emblem el-' + v.el + ' bg-' + v.el + ' rp-el-' + v.el + '">' + vnIcon(v, forPrint) + '<div class="vn-cap">' + (v.yang?'Yang ':'Yin ') + v.el + '<br><b>' + v.animal + '</b></div></div><div class="vn-body">' +
    '<div class="' + cls + 'vn-two"><div><h3 class="' + cls + 'vn-h vn-pro">The good side</h3><ul>' + v.traits.pros.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>' +
    '<div><h3 class="' + cls + 'vn-h vn-con">The not so good side</h3><ul>' + v.traits.cons.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div></div>' +
    '<div class="' + cls + 'vn-twist"><b>The ' + v.el + ' twist:</b> ' + esc(v.twist[0]) + '. Flip side: ' + esc(v.twist[1].charAt(0).toLowerCase() + v.twist[1].slice(1)) + '.</div></div></div>';
}
function vietNote(v){
  return 'Year boundary: Li Chun (Start of Spring, Sun at 315 degrees), the same moment that sets the BaZi Year Pillar. Year pillar ' + v.gz + '.';
}

/* ---------- Ten God strength chart ---------- */
var TG_ORDER = ['比肩','劫财','食神','伤官','偏财','正财','七杀','正官','偏印','正印'];
function seasonMult(c, el){
  // 旺 same as season 1.2 · 相 produced by season 1.1 · 休 produces season 1.0 · 囚 controls season 0.9 · 死 controlled by season 0.8
  var d = (E.ELEMENTS.indexOf(el) - E.ELEMENTS.indexOf(c.monthEl) + 5) % 5;
  return [1.2, 1.1, 0.8, 0.9, 1.0][d];
}
function godStem(dm, g){
  if(g === '比肩') return dm;
  for(var i = 0; i < 10; i++){ var s = E.STEMS[i]; if(s !== dm && E.tenGod(dm, s) === g) return s; }
  return '';
}
var HW = {1:[1], 2:[0.7,0.3], 3:[0.6,0.3,0.1]};
function addPillar(sc, c, stem, branch, mult){
  if(stem){ var g = stem === c.dm ? '比肩' : E.tenGod(c.dm, stem); sc[g] += 1 * seasonMult(c, E.stemEl(stem)); }
  if(branch){
    var hs = HIDDEN_OF[branch], w = HW[hs.length];
    hs.forEach(function(s, k){ var g = E.tenGod(c.dm, s); sc[g] += w[k] * (mult||1) * seasonMult(c, E.stemEl(s)); });
  }
}
var HIDDEN_OF = {'子':['癸'],'丑':['己','癸','辛'],'寅':['甲','丙','戊'],'卯':['乙'],'辰':['戊','乙','癸'],'巳':['丙','庚','戊'],'午':['丁','己'],'未':['己','丁','乙'],'申':['庚','壬','戊'],'酉':['辛'],'戌':['戊','辛','丁'],'亥':['壬','甲']};
function strengthChart(c, T){
  function blank(){ var o = {}; TG_ORDER.forEach(function(g){ o[g] = 0; }); return o; }
  var nat = blank();
  c.pillars.forEach(function(p){ if(!p.missing) addPillar(nat, c, p.stem, p.branch, p.key === 'month' ? 2 : 1); });
  var yr = blank(); TG_ORDER.forEach(function(g){ yr[g] = nat[g]; });

function mdToHtml(md){
  var lines = md.replace(/\r/g,'').split('\n'), out = [], inList = false;
  function inline(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
  lines.forEach(function(l){
    var t = l.trim();
    if(/^[-*] /.test(t)){ if(!inList){ out.push('<ul>'); inList = true; } out.push('<li>' + inline(t.slice(2)) + '</li>'); return; }
    if(inList){ out.push('</ul>'); inList = false; }
    if(!t) return;
    if(/^### /.test(t)) out.push('<h4>' + inline(t.slice(4)) + '</h4>');
    else if(/^## /.test(t)) out.push('<h3>' + inline(t.slice(3)) + '</h3>');
    else if(/^# /.test(t)) out.push('<h3>' + inline(t.slice(2)) + '</h3>');

  });

function requestSummary(){
  var c = state.chart, i = c.input;
  var lines = ['Name on chart: ' + (i.name || 'Not given'),
    'Born: ' + i.y + '-' + E.pad(i.m) + '-' + E.pad(i.d) + (i.timeKnown ? ' ' + E.pad(i.h) + ':' + E.pad(i.mi) : ' (time unknown)') + ', ' + i.place + ', ' + (i.gender === 'M' ? 'Male' : 'Female'),
    'Pillars (hour, day, month, year): ' + c.pillars.map(function(p){ return p.missing ? 'unknown' : p.gz; }).join(' '),
    'Day Master: ' + c.dm + ' ' + polEl(c.dmEl, c.dmYang) + ', ' + c.verdict,
    'Focus year: ' + (state.focusYear || currentBaziYear())];
  return lines.join('\n');
}

function wireRequest(){
  var open = $('rq-open'), form = $('rq-form'); if(!open || !form) return;
  open.onclick = function(){ form.hidden = !form.hidden; if(!form.hidden) $('rq-name').focus(); };
  var wa = $('rq-wa');
  if(wa){ wa.href = 'https://wa.me/' + BRY_WHATSAPP + '?text=' + encodeURIComponent('Hi Bry, I would like an in depth BaZi reading.\n\n' + requestSummary()); }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var st = $('rq-status'), btn = $('rq-send');
    var data = {'form-name':'reading-request', 'bot-field': form.querySelector('.rq-hp').value,
      name: $('rq-name').value.trim(), email: $('rq-email').value.trim(), phone: $('rq-phone').value.trim(),
      message: $('rq-msg').value.trim(), chart: requestSummary()};
    if(!data.name || !data.email){ st.textContent = 'Enter your name and email.'; return; }
    btn.disabled = true; st.textContent = 'Sending...';
    fetch('/', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(data).toString()})
    .then(function(r){ if(!r.ok) throw new Error(); form.innerHTML = '<p class="rq-done"><b>Request sent.</b> Thank you, ' + esc(data.name) + '. Bry will reply to ' + esc(data.email) + '.</p>'; })
    .catch(function(){ st.textContent = 'The request could not be sent from here. Please try again on baziwithbry.netlify.app.'; btn.disabled = false; });
  });
}

var PDF_LIBS = {

function loadScript(src){
  return new Promise(function(res, rej){ var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error('load')); }; document.head.appendChild(s); });
}
function ensurePdfLibs(){
  var jobs = [];
  if(!window.html2canvas) jobs.push(loadScript(PDF_LIBS.h2c));
  if(!(window.jspdf && window.jspdf.jsPDF)) jobs.push(loadScript(PDF_LIBS.jspdf));
  return Promise.all(jobs);
}

function rpStem(s){ return '<span class="rp-el-' + E.stemEl(s) + '">' + s + '</span>'; }

function rpInts(list){
  if(!list.length) return '<span class="rp-muted">None</span>';
  var order = {clash:0, harm:1, combo:2};
  return list.slice().sort(function(a,b){ return order[a.tone]-order[b.tone]; }).map(function(x){
    return '<div class="rp-int rp-' + x.tone + '"><b>' + x.type + ' ' + x.zh + '</b> ' + esc(x.text) + (x.note ? ' <span class="rp-muted">(' + esc(x.note) + ')</span>' : '') + '</div>';
  }).join('');
}

function buildReportPages(){
  var root = document.createElement('div');
  root.id = 'rp-root';
  document.body.appendChild(root);
  var c = state.chart, pages = [], page, content;
  var genDate = new Date(); var gen = genDate.getFullYear() + '-' + E.pad(genDate.getMonth()+1) + '-' + E.pad(genDate.getDate());
  function newPage(){
    page = document.createElement('div'); page.className = 'rp-page';
    page.innerHTML = '<div class="rp-head"><span>BaZi with Bry · Four Pillars Report</span><span>' + esc(c.input.name || 'Unnamed chart') + '</span></div><div class="rp-content"></div><div class="rp-foot"><span>Generated ' + gen + '</span><span class="rp-pn"></span></div>';
    root.appendChild(page); pages.push(page); content = page.querySelector('.rp-content');
  }
  function fits(){ return content.scrollHeight <= content.clientHeight + 1; }
  newPage();
  reportBlocks().forEach(function(b){
    if(b.html){
      var d = document.createElement('div'); d.className = 'rp-block'; d.innerHTML = b.html; content.appendChild(d);
      if(!fits() && content.children.length > 1){ content.removeChild(d); newPage(); content.appendChild(d); }
      return;
    }
    var t = b.table, first = true;
    function startTable(cont){
      var wrap = document.createElement('div'); wrap.className = 'rp-block';
      wrap.innerHTML = (cont ? '<div class="rp-cont">' + t.title.replace(/<[^>]+>/g,' ').split('.')[0].trim() + ' (continued)</div>' : t.title) + '<table class="rp-tbl"><thead>' + t.head + '</thead><tbody></tbody></table>';
      content.appendChild(wrap); return wrap;
    }
    var wrap = startTable(false), tb = wrap.querySelector('tbody'), placed = 0;
    t.rows.forEach(function(rh){
      tb.insertAdjacentHTML('beforeend', rh);
      if(!fits()){
        var tr = tb.lastElementChild; tb.removeChild(tr);
        if(placed === 0){ content.removeChild(wrap); newPage(); wrap = startTable(false); }
        else { newPage(); wrap = startTable(true); }
        tb = wrap.querySelector('tbody'); tb.appendChild(tr); placed = 0;
      }
      placed++;
    });
  });
  pages.forEach(function(p, k){ p.querySelector('.rp-pn').textContent = 'Page ' + (k+1) + ' of ' + pages.length; });
  return {root: root, pages: pages};
}

function pdfStatus(msg, ok){ var el = $('toast'); if(el){ el.textContent = msg; el.style.color = ok === false ? 'var(--clash)' : ''; } }
function makePdf(){
  var btn = $('b-pdf'); if(!state.chart || !btn) return;
  btn.disabled = true; pdfStatus('Building the report...');
  var built = null;
  ensurePdfLibs().then(function(){
    return (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve());
  }).then(function(){
    built = buildReportPages();
    var jsPDF = window.jspdf.jsPDF, doc = new jsPDF({unit:'pt', format:'a4', orientation:'portrait', compress:true});
    var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    var chain = Promise.resolve();
    built.pages.forEach(function(p, k){
      chain = chain.then(function(){
        pdfStatus('Rendering page ' + (k+1) + ' of ' + built.pages.length + '...');
        return window.html2canvas(p, {scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false}).then(function(cv){
          if(k > 0) doc.addPage();
          doc.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, H);
        });
      });
    });
    return chain.then(function(){ return doc; });
  }).then(function(doc){
    var i = state.chart.input, fy = state.focusYear || currentBaziYear();
    var name = 'BaZi Report ' + ((i.name || 'Chart').replace(/[^\w\- ]+/g,'').trim() || 'Chart') + ' ' + fy + '.pdf';
    var blob = doc.output('blob');
    if(built && built.root.parentNode) built.root.parentNode.removeChild(built.root);
    return saveBlob(blob, name);
  }).then(function(msg){ pdfStatus(msg); }, function(err){
    if(built && built.root.parentNode) built.root.parentNode.removeChild(built.root);
    pdfStatus(err && err.message === 'load' ? 'The PDF tools could not load. Check your internet connection and try again.' : 'The PDF could not be created. Try again.', false);
  }).then(function(){ btn.disabled = false; });
}
function saveBlob(blob, name){
  var inArtifact = !!(window.claude && window.claude.use);
  var nsP = downloadsNS ? Promise.resolve(downloadsNS) : (inArtifact ? window.claude.use('downloads') : Promise.resolve(null));
  return nsP.then(function(ns){
    if(ns){
      return ns.save({filename:name, data:blob}).then(function(){ return 'PDF ready: ' + name; }, function(e){
        var code = e && e.code;
        if(code === 'declined') return 'Download cancelled.';
        if(code === 'rate_limited') return 'A save prompt is already open. Finish it, then try again.';
        throw new Error('save');
      });
    }
    if(inArtifact) throw new Error('save');
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
    return 'PDF downloaded: ' + name;
  });
}

function storeSaved(a){ try { localStorage.setItem(KEY, JSON.stringify(a)); return true; } catch(e){ return false; } }
function fillSaved(){
  var a = loadSaved(), s = $('f-saved');
  s.innerHTML = a.length ? '<option value="">Choose a saved chart</option>' + a.map(function(x, i){ return '<option value="' + i + '">' + esc(x.name || 'Unnamed') + ' (' + x.date + ')</option>'; }).join('') : '<option value="">None saved yet</option>';
}
$('b-save').onclick = function(){
  var r = readInput(); if(r.error) return;
  var a = loadSaved();
  a.push({name:r.name, date:fdate.value, time:$('f-time').value, unknown:!r.timeKnown, gender:r.gender, city:$('f-manual').checked ? 'custom' : place, lon:$('f-lon').value, off:$('f-off').value, solar:r.trueSolar, zi:r.ziSect===1});
  if(storeSaved(a)) fillSaved();
};
$('b-del').onclick = function(){ var v = $('f-saved').value; if(v==='') return; var a = loadSaved(); a.splice(+v,1); storeSaved(a); fillSaved(); };
$('f-saved').onchange = function(){
  var v = this.value; if(v==='') return; var x = loadSaved()[+v]; if(!x) return;
  $('f-name').value = x.name||''; fdate.value = x.date; $('f-time').value = x.time||''; $('f-unknown').checked = !!x.unknown; $('f-time').disabled = !!x.unknown;
  setGender(x.gender); var man = x.city === 'custom' || typeof x.city !== 'object'; $('f-manual').checked = man; $('custom').hidden = !man; sel.disabled = man; if(!man){ place = x.city; sel.value = place.label; } else { sel.value = ''; } $('f-lon').value = x.lon||''; $('f-off').value = x.off||'';
  $('f-solar').checked = x.solar; $('f-zi').checked = x.zi; state.example = false; run();
};

function run(){
  var r = readInput();
  if(r.error){ $('results').innerHTML = '<section class="panel sect"><p class="empty" style="color:var(--clash)">' + esc(r.error) + '</p></section>'; return; }
  try {
    state.chart = BZ.calculate(r); state.chart.input = r; state.luckIdx = null; state.year = null; state.focusYear = null;
    render();
  } catch(e){
    if(window.console) console.error(e);
    $('results').innerHTML = '<section class="panel sect"><p class="empty" style="color:var(--clash)">The chart could not be calculated. Check the date and time, then try again.</p></section>';
  }
}
$('form').addEventListener('submit', function(e){ e.preventDefault(); state.example = false; run(); });

// example chart on first load
$('f-name').value = 'Sample chart'; fdate.value = '1990-06-15'; $('f-time').value = '14:30'; sel.value = place.label;
state.example = true; fillSaved(); updateHint();
if(typeof Solar === 'undefined'){
  $('results').innerHTML = '<section class="panel sect"><p class="empty">The calendar engine did not load. Check the connection and reload the page.</p></section>';
} else { run(); }
})();
</script>

</body>
</html>
